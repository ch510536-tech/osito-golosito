<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Osito Golosito</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#D3195E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Osito Golosito">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: barra lateral en computadora, barra inferior en celular. Rosa frambuesa del logo como acento. */
:root{
  --bg:#FFF5F8; --surface:#FFFFFF; --surface-2:#FFF0F5; --ink:#3B1428; --muted:#8C5D73; --line:#F4D2DF;
  --accent:#D3195E; --accent-ink:#FFFFFF; --accent-soft:#FDE3EE; --gummy:#E2321F; --gold:#D99A2B;
  --ok:#23824F; --ok-soft:#E1F4E8; --warn:#B86A00; --warn-soft:#FFF0D6; --crit:#C42B2B; --crit-soft:#FDE4E4;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(120,20,60,.06),0 6px 18px rgba(120,20,60,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1016; --surface:#28171F; --surface-2:#311C27; --ink:#FBEAF1; --muted:#C99BB0; --line:#47293A;
  --accent:#FF6A9E; --accent-ink:#2A0D19; --accent-soft:#4A1F33; --gummy:#FF6B57; --gold:#F0BC5A;
  --ok:#5ED394; --ok-soft:#173A27; --warn:#F2B45A; --warn-soft:#3D2A10; --crit:#FF7A7A; --crit-soft:#451C1F;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1C1016; --surface:#28171F; --surface-2:#311C27; --ink:#FBEAF1; --muted:#C99BB0; --line:#47293A;
  --accent:#FF6A9E; --accent-ink:#2A0D19; --accent-soft:#4A1F33; --gummy:#FF6B57; --gold:#F0BC5A;
  --ok:#5ED394; --ok-soft:#173A27; --warn:#F2B45A; --warn-soft:#3D2A10; --crit:#FF7A7A; --crit-soft:#451C1F;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.1px}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:18px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px}
.brand img{width:52px;height:52px;border-radius:50%}
.brand b{font-family:var(--display);font-size:19px;line-height:1.05;color:var(--accent)}
.brand small{display:block;color:var(--muted);font-size:12px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:700}
.nav a svg{width:20px;height:20px;flex:none}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav .badge{margin-left:auto;background:var(--accent);color:var(--accent-ink);font-size:11px;padding:1px 7px;border-radius:99px}
main{padding:22px 28px 40px;min-width:0;max-width:1180px;width:100%}
.topbar{display:none}
.bottom{display:none}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head p{margin:2px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi .lab{color:var(--muted);font-size:13px;font-weight:700}
.kpi .val{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.15;margin-top:4px}
.kpi .sub{color:var(--muted);font-size:13px}
.kpi.hot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hot .lab,.kpi.hot .sub{color:inherit;opacity:.85}
a.kpi{text-decoration:none;color:inherit;display:block}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted)}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:6px;min-height:42px;text-decoration:none}
.btn:hover{filter:brightness(1.05)}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--crit-soft);color:var(--crit)}
.btn.sm{padding:6px 11px;min-height:34px;font-size:13px;border-radius:10px}
.btn.big{width:100%;justify-content:center;min-height:52px;font-size:17px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 11px;min-height:42px;width:100%}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-weight:800;cursor:pointer;color:var(--muted);min-height:36px}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-crit{background:var(--crit-soft);color:var(--crit)}
.p-acc{background:var(--accent-soft);color:var(--accent)} .p-mut{background:var(--surface-2);color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li.click{cursor:pointer;border-radius:10px;padding-left:8px;padding-right:8px}
.li.click:hover{background:var(--surface-2)}
.li .t{font-weight:700;min-width:0;overflow-wrap:anywhere}
.li .s{font-size:13px;color:var(--muted)}
.right{text-align:right;margin-left:auto}
.bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
/* tabla */
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
/* vender */
.sell{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
.cart{position:sticky;top:16px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pbtn{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:84px;box-shadow:var(--shadow)}
.pbtn:hover{border-color:var(--accent)}
.pbtn b{font-weight:800;line-height:1.2}
.pbtn .q{font-size:12px;color:var(--muted)}
.pbtn .pr{margin-top:auto;font-family:var(--display);color:var(--accent);font-size:17px}
.pbtn.out{opacity:.55}
.pbtn.inc{border-color:var(--accent);background:var(--accent-soft)}
.cl{display:grid;grid-template-columns:1fr auto;gap:6px 8px;padding:10px 0;border-bottom:1px dashed var(--line)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{border:0;background:var(--surface-2);width:34px;height:34px;font-size:18px;font-weight:800;cursor:pointer;color:var(--accent)}
.step input{width:44px;border:0;text-align:center;background:var(--surface);height:34px}
.price{width:76px}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 6px;font-family:var(--display)}
.total b{font-size:28px}
.warnline{font-size:12px;color:var(--warn);font-weight:700;grid-column:1/-1}
/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:9px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(40,8,22,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:18px;width:min(520px,100%);max-height:calc(100% - 24px);overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{margin-bottom:12px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.fg{display:grid;gap:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.banner{padding:12px 14px;border-radius:12px;margin-bottom:14px;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
/* ticket */
.ticket{background:#fff;color:#2b1020;border-radius:12px;padding:18px 18px 14px;border:1px dashed #e7b9cb;font-size:14px}
.ticket .tc{text-align:center}
.ticket img{width:84px;height:84px}
.ticket .tn{font-family:var(--display);font-size:20px;color:#C3165A}
.ticket hr{border:0;border-top:1px dashed #d8a8bb;margin:10px 0}
.ticket .tl{display:flex;justify-content:space-between;gap:8px}
.ticket .tt{font-family:var(--display);font-size:22px}
.stamp{display:inline-block;padding:3px 10px;border-radius:8px;font-weight:800;font-size:13px}
.method{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.method button{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 4px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted)}
.method button svg{width:20px;height:20px}
.method button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.morel a{display:flex;align-items:center;gap:12px;padding:14px;text-decoration:none;color:var(--ink);font-weight:800;border-bottom:1px solid var(--line)}
.morel a:last-child{border-bottom:0}
.morel svg{width:22px;height:22px;color:var(--accent)}
.minibar{display:none}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))} .sell{grid-template-columns:1fr} .cart{position:static;order:-1}
  .minibar{display:flex;position:fixed;left:16px;right:16px;bottom:16px;z-index:19;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:12px 16px;font-weight:800;box-shadow:0 8px 24px rgba(120,20,60,.3);cursor:pointer}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .topbar img{width:38px;height:38px;border-radius:50%}
  .topbar b{font-family:var(--display);color:var(--accent);font-size:18px}
  .topbar a{margin-left:auto;color:var(--accent);padding:8px;display:flex}
  main{padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
  .bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted);text-decoration:none;padding:4px 0;position:relative}
  .bottom a svg{width:22px;height:22px}
  .bottom a.on{color:var(--accent)}
  .minibar{bottom:calc(70px + env(safe-area-inset-bottom))}
  main.hasbar{padding-bottom:calc(160px + env(safe-area-inset-bottom))}
  .bottom .badge{position:absolute;top:0;right:calc(50% - 22px);background:var(--accent);color:var(--accent-ink);font-size:10px;padding:0 5px;border-radius:99px}
  h1{font-size:23px}
  .g2,.g3{grid-template-columns:1fr}
  .kpi .val{font-size:23px}
  .resp thead{display:none}
  .resp tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 4px;border-bottom:1px solid var(--line)}
  .resp td{border:0;padding:0}
  .resp td.hide-m{display:none}
  .resp td.n{text-align:right}
  .resp td.sub-m{grid-column:1/-1;color:var(--muted);font-size:13px;text-align:left}
}
body.nologin .side,body.nologin .topbar,body.nologin .bottom{display:none!important}
body.nologin .app{grid-template-columns:1fr}
body.nologin main{max-width:440px;margin:0 auto;padding-top:calc(40px + env(safe-area-inset-top))}
.login{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.login .lg{width:150px;height:150px;align-self:center;border-radius:50%}
.login h1{text-align:center;color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><img alt="Logo Osito Golosito" src="logo.png"><div><b>Osito Golosito</b><small>Control del negocio</small></div></div>
    <nav class="nav" id="sidenav"></nav>
  </aside>
  <div>
    <header class="topbar"><img alt="" src="logo.png"><b>Osito Golosito</b><a href="#buscar" aria-label="Buscar"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></a></header>
    <main id="view"></main>
  </div>
</div>
<nav class="bottom" id="bottomnav"></nav>
<div id="modalroot"></div>
<div id="toastroot"></div>
<script>
"use strict";
const LOGO = "logo.png";
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtMx = new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",minimumFractionDigits:2,maximumFractionDigits:2});
const fmtMx0 = new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",minimumFractionDigits:0,maximumFractionDigits:0});
const money = n => { n = Math.round((+n||0)*100)/100; return Number.isInteger(n) ? fmtMx0.format(n) : fmtMx.format(n); };
const int = n => new Intl.NumberFormat("es-MX").format(Math.round(+n||0));
const pad = n => String(n).padStart(2,"0");
const isoDate = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => isoDate(new Date());
const addDays = (iso,k) => { const d = new Date(iso+"T12:00:00"); d.setDate(d.getDate()+k); return isoDate(d); };
const dLong = iso => iso ? new Date(iso+"T12:00:00").toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"}) : "";
const dShort = iso => iso ? new Date(iso+"T12:00:00").toLocaleDateString("es-MX",{day:"numeric",month:"short"}).replace(".","") : "";
const dFull = iso => iso ? new Date(iso+"T12:00:00").toLocaleDateString("es-MX",{day:"2-digit",month:"2-digit",year:"numeric"}) : "";
const hhmm = ts => ts ? new Date(ts).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"}) : "";
const norm = s => String(s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const ckey = s => norm(s).replace(/\s+/g," ");
const num = v => { const x = parseFloat(String(v).replace(",",".")); return isFinite(x) ? x : NaN; };
const METODOS = {efectivo:"Efectivo", transferencia:"Transferencia", tarjeta:"Tarjeta"};
const folio = () => { const d=new Date(); return "OG-"+String(d.getFullYear()).slice(2)+pad(d.getMonth()+1)+pad(d.getDate())+"-"+Date.now().toString(36).slice(-4).toUpperCase(); };

const IC = {
  inicio:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  vender:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11L21 7H6.2"/>',
  fiados:'<path d="M16 11a4 4 0 1 0-8 0"/><circle cx="12" cy="6" r="3"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/><path d="M18 3v4M16 5h4"/>',
  inventario:'<path d="M21 8l-9-5-9 5 9 5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
  ventas:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  buscar:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  compras:'<path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/>',
  ajustes:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  mas:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  efectivo:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  transferencia:'<path d="M4 9h14l-4-4M20 15H6l4 4"/>',
  tarjeta:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>'
};
const icon = (k,w=20) => `<svg viewBox="0 0 24 24" width="${w}" height="${w}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;

/* ---------- estado ---------- */
const DEF_CFG = {costoPaquete:486, bolsitasPaquete:700, minimo:2, precioMayoreo:10, telefono:"", mensaje:"¡Gracias por tu compra!"};
const S = {prods:{}, compras:[], ventas:[], abonos:[], cfg:{...DEF_CFG}, loaded:{}, err:null, slow:false, db:null, dl:null};
const UI = {
  route:"inicio", cart:[], tipo:"menudeo", pago:"pagado", metodo:"efectivo", fecha:today(), cliente:"", q:"",
  invQ:"", invF:"todos", vPer:"mes", vTipo:"todas", vProd:"", vQ:"", cliSel:null, gq:"", compQ:""
};

/* ---------- cálculos ---------- */
let C = null;
function compute(){
  const cfg = S.cfg, bag = (+cfg.bolsitasPaquete>0) ? (+cfg.costoPaquete)/(+cfg.bolsitasPaquete) : 0;
  const P = {};
  for (const [id,p] of Object.entries(S.prods)) P[id] = {id, ...p, costo:0, armadas:0, vend:0, vendido:0};
  let inversion = 0;
  for (const c of S.compras){ inversion += +c.costo||0; if (c.prod && P[c.prod]){ P[c.prod].costo += +c.costo||0; P[c.prod].armadas += +c.bolsitas||0; } }
  for (const v of S.ventas){ const p = P[v.prod]; if (!p) continue; p.vend += +v.cant||0; p.vendido += (+v.cant||0)*(+v.precio||0); }
  for (const p of Object.values(P)){
    p.unit = (p.armadas>0 ? p.costo/p.armadas : 0) + bag;
    p.exist = p.armadas - p.vend;
    p.ganancia = p.vendido - p.vend*p.unit;
    p.margen = (+p.precio||0) - p.unit;
  }
  const minimo = +cfg.minimo||0;
  for (const p of Object.values(P)) p.estado = p.exist<=0 ? "agotado" : (p.exist<=minimo ? "bajo" : "ok");
  // clientes
  const CL = {};
  const cli = name => { const k = ckey(name); if(!k) return null; if(!CL[k]) CL[k] = {k, nombre:String(name).trim(), debe:0, pago:0, comprado:0, movs:[], last:""}; return CL[k]; };
  let contado = 0;
  const porMetodo = {efectivo:0, transferencia:0, tarjeta:0, previo:0};
  const tickets = {};
  for (const v of S.ventas){
    const t = (+v.cant||0)*(+v.precio||0);
    const tk = v.ticket || ("v:"+v.id);
    (tickets[tk] ||= {id:tk, folio:v.ticket||"", lines:[], fecha:v.fecha, creado:v.creado||0, tipo:v.tipo, pagado:v.pagado!==false, metodo:v.metodo||"", cliente:v.cliente||"", total:0}).lines.push(v);
    tickets[tk].total += t;
    if (v.pagado === false){ const c = cli(v.cliente); if (c){ c.debe += t; c.movs.push({k:"venta", v, t, fecha:v.fecha, creado:v.creado||0}); } }
    else { contado += t; porMetodo[v.metodo||"previo"] = (porMetodo[v.metodo||"previo"]||0) + t; }
    if (v.cliente){ const c = cli(v.cliente); if (c){ c.comprado += t; if (v.fecha > c.last) c.last = v.fecha; } }
  }
  let abonado = 0;
  for (const a of S.abonos){ const c = cli(a.cliente); abonado += +a.monto||0; porMetodo[a.metodo||"efectivo"] = (porMetodo[a.metodo||"efectivo"]||0) + (+a.monto||0);
    if (c){ c.pago += +a.monto||0; c.movs.push({k:"abono", a, t:+a.monto||0, fecha:a.fecha, creado:a.creado||0}); if (a.fecha > c.last) c.last = a.fecha; } }
  for (const c of Object.values(CL)){ c.saldo = Math.round((c.debe - c.pago)*100)/100; c.movs.sort((x,y)=> x.fecha<y.fecha?-1:x.fecha>y.fecha?1:(x.creado-y.creado)); }
  const porCobrar = Object.values(CL).reduce((s,c)=> s + Math.max(0,c.saldo), 0);
  const deudores = Object.values(CL).filter(c=>c.saldo>0.004).sort((a,b)=>b.saldo-a.saldo);
  const tlist = Object.values(tickets).sort((a,b)=> a.fecha<b.fecha?1:a.fecha>b.fecha?-1:(b.creado-a.creado));
  const activos = Object.values(P).filter(p=>p.activo!==false);
  C = {P, bag, inversion, contado, abonado, cobrado:contado+abonado, porCobrar, deudores, CL, porMetodo, tickets, tlist, activos,
       vendidoTot:S.ventas.reduce((s,v)=>s+(+v.cant||0)*(+v.precio||0),0),
       quedaValor:activos.reduce((s,p)=>s+Math.max(0,p.exist)*(+p.precio||0),0),
       existTot:activos.reduce((s,p)=>s+Math.max(0,p.exist),0)};
}
const pname = id => (S.prods[id]?.nombre) || "Dulce eliminado";
const ventasEn = (desde,hasta) => S.ventas.filter(v=> v.fecha>=desde && v.fecha<=hasta);
function resumen(vs){ let b=0,t=0,g=0; for(const v of vs){ const c=+v.cant||0, tt=c*(+v.precio||0); b+=c; t+=tt; g+= tt - c*(C.P[v.prod]?.unit||0);} return {b,t,g}; }
function clientesConocidos(){ return Object.values(C.CL).map(c=>c.nombre).sort((a,b)=>a.localeCompare(b,"es")); }

/* ---------- navegación ---------- */
const ROUTES = ["inicio","vender","fiados","inventario","ventas","buscar","compras","ajustes","mas"];
const NAVS = [["inicio","Inicio"],["vender","Vender"],["fiados","Me deben"],["inventario","Inventario"],["ventas","Ventas"],["buscar","Buscar"],["compras","Compras"],["ajustes","Ajustes"]];
const BNAV = [["inicio","Inicio"],["vender","Vender"],["fiados","Me deben"],["inventario","Inventario"],["mas","Más"]];
function go(r){ location.hash = r; }
function routeFromHash(){ const h = location.hash.replace("#",""); UI.route = ROUTES.includes(h) ? h : "inicio"; }
function renderNav(){
  const nDeb = C ? C.deudores.length : 0;
  const act = r => UI.route===r || (r==="mas" && ["ventas","buscar","compras","ajustes","mas"].includes(UI.route));
  $("#sidenav").innerHTML = NAVS.map(([r,l])=>`<a href="#${r}" class="${UI.route===r?"on":""}">${icon(r)}<span>${l}</span>${r==="fiados"&&nDeb?`<span class="badge">${nDeb}</span>`:""}</a>`).join("");
  $("#bottomnav").innerHTML = BNAV.map(([r,l])=>`<a href="#${r}" class="${act(r)?"on":""}">${icon(r)}<span>${l}</span>${r==="fiados"&&nDeb?`<span class="badge">${nDeb}</span>`:""}</a>`).join("");
}

/* ---------- render ---------- */
let rq = 0;
function render(){ cancelAnimationFrame(rq); rq = requestAnimationFrame(doRender); }
function doRender(){
  const ae = document.activeElement, fid = ae && ae.id, sel = (ae && "selectionStart" in ae) ? [ae.selectionStart, ae.selectionEnd] : null;
  const v = $("#view");
  document.body.classList.toggle("nologin", !S.user);
  if (!S.user){ v.innerHTML = loginView(); return; }
  compute(); renderNav();
  let html = "";
  if (S.err) html += `<div class="banner p-crit">${esc(S.err)}</div>`;
  else if (!navigator.onLine) html += `<div class="banner p-warn">Sin internet. Puedes seguir vendiendo: lo que anotes se guarda en tu teléfono y se sube solo cuando vuelva la señal.</div>`;
  else if (!allLoaded() && S.slow) html += `<div class="banner p-warn">Tus datos están tardando en cargar. Revisa tu conexión; lo que ves puede no estar al día.</div>`;
  if (!allLoaded() && !S.err && !Object.keys(S.prods).length && !S.slow) html += `<div class="empty">Cargando tus datos…</div>`;
  else if (!Object.keys(S.prods).length && !S.err && UI.route!=="ajustes") html += `<div class="card" style="margin-bottom:14px"><h2>Tu app está vacía</h2><p>Para pasar tus dulces y ventas, ve a Ajustes y toca <b>Cargar respaldo</b>; elige el archivo <b>osito-respaldo.json</b>.</p><a class="btn" href="#ajustes">Ir a Ajustes</a></div>` + (VIEWS[UI.route]||VIEWS.inicio)();
  else if (Object.keys(S.prods).length || UI.route==="ajustes") html += (VIEWS[UI.route]||VIEWS.inicio)();
  v.innerHTML = html; v.classList.toggle("hasbar", UI.route==="vender" && UI.cart.length>0);
  afterRender();
  if (fid){ const el = document.getElementById(fid); if (el){ el.focus({preventScroll:true}); if (sel && el.setSelectionRange) try{ el.setSelectionRange(sel[0],sel[1]); }catch(e){} } }
}
const allLoaded = () => ["prods","compras","ventas","abonos"].every(k=>S.loaded[k]);

const VIEWS = {};
/* ===== INICIO ===== */
VIEWS.inicio = () => {

  const rH = resumen(ventasEn(hoy,hoy)), r7 = resumen(ventasEn(ini7,hoy)), rM = resumen(S.ventas.filter(v=>v.fecha.startsWith(mes)));

  const dif = C.cobrado - C.inversion;
  const bajos = C.activos.filter(p=>p.estado!=="ok").sort((a,b)=>a.exist-b.exist);
  const top = {}; for (const v of S.ventas.filter(v=>v.fecha.startsWith(mes))) top[v.prod]=(top[v.prod]||0)+(+v.cant||0);
  const topL = Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const mesNom = new Date(hoy+"T12:00:00").toLocaleDateString("es-MX",{month:"long"});
  return `

  <div class="grid g4">
    <div class="card kpi hot"><div class="lab">Vendido hoy</div><div class="val num">${money(rH.t)}</div><div class="sub">${int(rH.b)} bolsitas · ganancia ${money(rH.g)}</div></div>
    <div class="card kpi"><div class="lab">Últimos 7 días</div><div class="val num">${money(r7.t)}</div><div class="sub">${int(r7.b)} bolsitas · ganancia ${money(r7.g)}</div></div>
    <div class="card kpi"><div class="lab">En ${esc(mesNom)}</div><div class="val num">${money(rM.t)}</div><div class="sub">${int(rM.b)} bolsitas · ganancia ${money(rM.g)}</div></div>
    <a class="card kpi" href="#fiados"><div class="lab">Me deben</div><div class="val num" style="color:${C.porCobrar>0?"var(--accent)":"inherit"}">${money(C.porCobrar)}</div><div class="sub">${C.deudores.length} ${C.deudores.length===1?"cliente":"clientes"} con saldo</div></a>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card">
      <h2>Tu inversión</h2>
      <div class="row" style="margin:10px 0 6px"><span class="muted">Invertido</span><span class="sp"></span><b class="num">${money(C.inversion)}</b></div>
      <div class="row" style="margin-bottom:8px"><span class="muted">Ya cobrado</span><span class="sp"></span><b class="num">${money(C.cobrado)}</b></div>
      <div class="bar" role="img" aria-label="Recuperado ${Math.round(pct)}%"><i style="width:${pct}%"></i></div>
      <p style="margin:10px 0 0">${dif>=0 ? `Ya recuperaste lo invertido y llevas <b>${money(dif)}</b> de más.` : `Te faltan <b>${money(-dif)}</b> para recuperar lo invertido.`}</p>
      <p class="muted" style="margin:6px 0 0">Si vendes lo que te queda (${int(C.existTot)} bolsitas) juntarías ${money(C.quedaValor)} más${C.porCobrar>0?`, y aún te deben ${money(C.porCobrar)}`:""}.</p>
    </div>
    <div class="card">
      <h2>Cómo te pagaron</h2>
      <p class="muted" style="margin:2px 0 10px">Todo lo cobrado, incluyendo abonos de fiado</p>
      ${[...Object.entries(METODOS), ...(C.porMetodo.previo>0?[["previo","Ventas pasadas del Excel"]]:[])].map(([k,l])=>{ const val=C.porMetodo[k]||0, w=C.cobrado>0?val/C.cobrado*100:0; return `
        <div style="margin-bottom:10px"><div class="row"><span class="row" style="gap:6px;color:var(--muted)">${IC[k]?icon(k,18):icon("ventas",18)} ${l}</span><span class="sp"></span><b class="num">${money(val)}</b></div>
        <div class="bar" style="margin-top:5px"><i style="width:${w}%"></i></div></div>`;}).join("")}
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    <div class="row"><h2>Ventas por día</h2><span class="muted">últimos 30 días</span></div>
    <div class="chart" id="chart"></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><div class="row"><h2>Por agotarse</h2><span class="sp"></span><a class="btn sm sec" href="#inventario">Ver inventario</a></div>
      <div class="list" style="margin-top:6px">${bajos.length? bajos.slice(0,8).map(p=>`<div class="li click" data-act="prod" data-id="${p.id}"><span class="t">${esc(p.nombre)}</span><span class="right">${estadoPill(p)}</span></div>`).join("") : `<div class="empty">Todo tiene existencia suficiente.</div>`}
      ${bajos.length>8?`<div class="muted" style="padding-top:8px">y ${bajos.length-8} más…</div>`:""}</div></div>
    <div class="card"><h2>Lo más vendido en ${esc(mesNom)}</h2>
      <div class="list" style="margin-top:6px">${topL.length? topL.map(([id,n],i)=>`<div class="li"><span class="pill p-acc num">${i+1}</span><span class="t">${esc(pname(id))}</span><span class="right num"><b>${int(n)}</b> <span class="muted">bolsitas</span></span></div>`).join("") : `<div class="empty">Aún no hay ventas este mes.</div>`}</div></div>

function estadoPill(p){
  if (p.exist<=0) return `<span class="pill p-crit">Agotado</span>`;
  if (p.estado==="bajo") return `<span class="pill p-warn num">Quedan ${int(p.exist)}</span>`;
  return `<span class="pill p-ok num">Quedan ${int(p.exist)}</span>`;
}
function drawChart(){
  const el = $("#chart"); if (!el) return;
  const W = Math.max(300, el.clientWidth), H = 220, m = {l:48,r:8,t:12,b:28};
  const hoy = today(), days = []; for (let i=29;i>=0;i--) days.push(addDays(hoy,-i));
  const by = {}; for (const v of S.ventas){ if (v.fecha>=days[0]) { const o = by[v.fecha] ||= {t:0,b:0,f:0}; const t=(+v.cant||0)*(+v.precio||0); o.t+=t; o.b+=+v.cant||0; if(v.pagado===false) o.f+=t; } }
  const vals = days.map(d=>by[d]?.t||0), max = Math.max(...vals, 10);
  const step = niceStep(max/3), top = Math.ceil(max/step)*step;
  const iw = W-m.l-m.r, ih = H-m.t-m.b, bw = iw/days.length, gap = Math.max(2, bw*.22);
  const y = v => m.t + ih - (v/top)*ih;
  let g = "";
  for (let v=0; v<=top+0.001; v+=step){ g += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${money(v)}</text>`; }
  let bars = "";
  days.forEach((d,i)=>{ const v = vals[i], x = m.l + i*bw + gap/2, w = bw-gap, h = (v/top)*ih, r = Math.min(4, w/2, h);
    if (v>0) bars += `<path d="M${x},${m.t+ih} V${m.t+ih-h+r} Q${x},${m.t+ih-h} ${x+r},${m.t+ih-h} H${x+w-r} Q${x+w},${m.t+ih-h} ${x+w},${m.t+ih-h+r} V${m.t+ih} Z" fill="${d===hoy?"var(--gummy)":"var(--accent)"}"/>`;
    bars += `<rect x="${m.l+i*bw}" y="${m.t}" width="${bw}" height="${ih}" fill="transparent" data-i="${i}" style="cursor:pointer"/>`;
    if (i%5===4 || i===29) bars += `<text x="${m.l+i*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${d===hoy?"hoy":dShort(d)}</text>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Ventas por día de los últimos 30 días">${g}${bars}</svg><div class="tip" id="tip"></div>`;
  const tip = $("#tip");
  const show = e => { const r = e.target.closest("rect[data-i]"); if (!r){ tip.style.opacity=0; return; } const i=+r.dataset.i, d=days[i], o=by[d]||{t:0,b:0,f:0};
    tip.innerHTML = `<b>${esc(dLong(d))}</b><br>${money(o.t)} · ${int(o.b)} bolsitas${o.f?`<br>fiado: ${money(o.f)}`:""}`;
    const bx = (m.l+i*bw+bw/2)/W*el.clientWidth; tip.style.left = Math.min(el.clientWidth-70, Math.max(70,bx))+"px"; tip.style.top = (y(o.t))/H*el.clientWidth*(H/W)+"px"; tip.style.opacity=1; };
  el.onmousemove = show; el.onclick = show; el.onmouseleave = ()=> tip.style.opacity=0;
}
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(Math.max(x,1)))); const f = x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }

/* ===== VENDER ===== */

  const inCart = new Set(UI.cart.map(l=>l.prod));

          <div class="field"><label for="v-cli">Cliente ${fiado?"(obligatorio)":"(opcional)"}</label><input class="inp" id="v-cli" list="dl-cli" data-bind="cliente" value="${esc(UI.cliente)}" placeholder="Nombre" autocomplete="off"></div>

            ${over?`<div class="warnline">Solo quedan ${int(p.exist)} en inventario.</div>`:""}
          </div>`;}).join("") : `<div class="empty">Toca los dulces para agregarlos.</div>`}
      </div>
      <div class="total"><span>${int(nb)} bolsitas</span><b class="num">${money(tot)}</b></div>

    </div>`;
  return `
  <div class="head"><div><h1>Vender</h1><p>${UI.tipo==="mayoreo"?`Precio de mayoreo: ${money(S.cfg.precioMayoreo)} por bolsita (lo puedes cambiar en cada dulce)`:"Precio normal por bolsita"}</p></div></div>
  <div class="sell">

      <input class="inp" id="v-q" data-bind="q" value="${esc(UI.q)}" placeholder="Buscar dulce…" autocomplete="off" style="margin-bottom:12px">
      <div class="pgrid">${list.map(p=>`<button class="pbtn ${p.exist<=0?"out":""} ${inCart.has(p.id)?"inc":""}" data-act="add" data-id="${p.id}"><b>${esc(p.nombre)}</b><span class="q">${p.exist<=0?"Agotado":`Quedan ${int(p.exist)}`}</span><span class="pr num">${money(precioPara(p))}</span></button>`).join("") || `<div class="empty">No hay dulces con ese nombre.</div>`}</div>

};
function metodoPicker(cur, act){ return `<div class="method" role="group">${Object.entries(METODOS).map(([k,l])=>`<button type="button" data-act="${act}" data-v="${k}" class="${cur===k?"on":""}">${icon(k)}${l}</button>`).join("")}</div>`; }
function precioPara(p){ return UI.tipo==="mayoreo" ? (p.precioMayoreo!=null && p.precioMayoreo!=="" ? +p.precioMayoreo : +S.cfg.precioMayoreo) : +p.precio||0; }

/* ===== ME DEBEN ===== */
VIEWS.fiados = () => {

  return `
  <div class="head"><div><h1>Me deben</h1><p>Lo fiado ya se descontó de tu inventario. Cuando te paguen, cóbralo aquí.</p></div><button class="btn" data-act="nuevofiado">${icon("vender",18)} Nuevo fiado</button></div>
  <div class="grid g3">
    <div class="card kpi hot"><div class="lab">Total por cobrar</div><div class="val num">${money(C.porCobrar)}</div><div class="sub">${C.deudores.length} ${C.deudores.length===1?"cliente":"clientes"}</div></div>
    <div class="card kpi"><div class="lab">Fiado en total</div><div class="val num">${money(Object.values(C.CL).reduce((s,c)=>s+c.debe,0))}</div><div class="sub">desde que empezaste</div></div>
    <div class="card kpi"><div class="lab">Ya te pagaron de fiados</div><div class="val num">${money(C.abonado)}</div><div class="sub">${S.abonos.length} pagos registrados</div></div>
  </div>
  <div class="card" style="margin-top:14px"><h2>Con saldo pendiente</h2>
    <div class="list" style="margin-top:6px">${C.deudores.length ? C.deudores.map(c=>`
      <div class="li click" data-act="cli" data-k="${esc(c.k)}"><div><div class="t">${esc(c.nombre)}</div><div class="s">Último movimiento: ${esc(dShort(c.last))}${c.pago>0?` · ha abonado ${money(c.pago)}`:""}</div></div>
      <div class="right"><div class="num" style="font-family:var(--display);font-size:20px;color:var(--accent)">${money(c.saldo)}</div></div></div>`).join("") : `<div class="empty">Nadie te debe. Para fiar, en Vender elige “Me lo debe”.</div>`}</div></div>
  ${alDia.length?`<div class="card" style="margin-top:14px"><h2>Al corriente</h2><div class="list" style="margin-top:6px">${alDia.map(c=>`<div class="li click" data-act="cli" data-k="${esc(c.k)}"><span class="t">${esc(c.nombre)}</span><span class="right pill p-ok">Pagado</span></div>`).join("")}</div></div>`:""}`;
};
function clienteView(c){
  let run = 0;
  const rows = c.movs.map(m=>{ if (m.k==="venta"){ run += m.t; return {m, run}; } run -= m.t; return {m, run}; }).reverse();
  const compras = Object.values(C.tickets).filter(t=>ckey(t.cliente)===c.k);
  return `
  <div class="head"><div><button class="btn sm ghost" data-act="cliback">← Me deben</button><h1 style="margin-top:8px">${esc(c.nombre)}</h1><p>${compras.length} ${compras.length===1?"compra":"compras"} · ha comprado ${money(c.comprado)} en total</p></div></div>
  <div class="grid g2">
    <div class="card kpi ${c.saldo>0?"hot":""}"><div class="lab">Debe</div><div class="val num">${money(Math.max(0,c.saldo))}</div><div class="sub">Fiado ${money(c.debe)} · abonado ${money(c.pago)}</div></div>
    <div class="card" style="display:flex;flex-direction:column;gap:8px;justify-content:center">
      <button class="btn big" data-act="cobrar" data-k="${esc(c.k)}" data-total="1" ${c.saldo>0?"":"disabled"}>Cobrar todo (${money(Math.max(0,c.saldo))})</button>
      <div class="row"><button class="btn sec" style="flex:1;justify-content:center" data-act="cobrar" data-k="${esc(c.k)}" ${c.saldo>0?"":"disabled"}>Abonar una parte</button><button class="btn ghost" style="flex:1;justify-content:center" data-act="fiarle" data-k="${esc(c.k)}">Fiarle más</button></div>
    </div>
  </div>
  <div class="card" style="margin-top:14px"><h2>Movimientos</h2>
    <div class="list" style="margin-top:6px">${rows.length? rows.map(({m,run})=> m.k==="venta" ? `
      <div class="li click" data-act="ticket" data-id="${esc(m.v.ticket||("v:"+m.v.id))}"><span class="pill p-warn">Fiado</span><div><div class="t">${esc(pname(m.v.prod))} <span class="muted num">${int(m.v.cant)} × ${money(m.v.precio)}</span></div><div class="s">${esc(dShort(m.fecha))}</div></div><div class="right"><div class="num"><b>+${money(m.t)}</b></div><div class="s num">saldo ${money(run)}</div></div></div>` : `
      <div class="li click" data-act="recibo" data-id="${esc(m.a.id)}"><span class="pill p-ok">Pago</span><div><div class="t">${esc(METODOS[m.a.metodo]||"Efectivo")}${m.a.nota?` · ${esc(m.a.nota)}`:""}</div><div class="s">${esc(dShort(m.fecha))}${m.a.folio?` · ${esc(m.a.folio)}`:""}</div></div><div class="right"><div class="num" style="color:var(--ok)"><b>−${money(m.t)}</b></div><div class="s num">saldo ${money(run)}</div></div></div>`).join("") : `<div class="empty">Sin fiados todavía.</div>`}</div></div>`;
}

/* ===== INVENTARIO ===== */

  let list = Object.values(C.P).filter(p=> UI.invF==="archivados" ? p.activo===false : p.activo!==false);
  if (UI.invF==="bajos") list = list.filter(p=>p.estado==="bajo");
  if (UI.invF==="agotados") list = list.filter(p=>p.exist<=0);
  if (q) list = list.filter(p=>norm(p.nombre).includes(q));
  list.sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
  const nAg = C.activos.filter(p=>p.exist<=0).length, nBa = C.activos.filter(p=>p.estado==="bajo").length;
  const totG = C.activos.reduce((s,p)=>s+p.ganancia,0);
  return `
  <div class="head"><div><h1>Inventario</h1><p>${C.activos.length} dulces · ${int(C.existTot)} bolsitas en existencia · valen ${money(C.quedaValor)} a precio de venta</p></div><button class="btn" data-act="nuevoprod">+ Nuevo dulce</button></div>

    <input class="inp" id="i-q" data-bind="invQ" value="${esc(UI.invQ)}" placeholder="Buscar dulce…" style="max-width:320px" autocomplete="off">

      <td class="n hide-m">${money(p.unit)}</td><td class="n hide-m">${money(p.precio)}</td><td class="n hide-m" style="color:${p.margen<0?"var(--crit)":"inherit"}">${money(p.margen)}</td>
      <td class="n hide-m">${int(p.vend)}</td><td class="n hide-m">${money(p.vendido)}</td><td class="n hide-m"><b>${money(p.ganancia)}</b></td></tr>`).join("") || `<tr><td colspan="8" class="empty">No hay dulces aquí.</td></tr>`}</tbody>
    ${UI.invF!=="archivados" && !q && UI.invF==="todos" ? `<tfoot><tr><td><b>Total</b></td><td></td><td class="hide-m"></td><td class="hide-m"></td><td class="hide-m"></td><td class="n hide-m"><b>${int(C.activos.reduce((s,p)=>s+p.vend,0))}</b></td><td class="n hide-m"><b>${money(C.activos.reduce((s,p)=>s+p.vendido,0))}</b></td><td class="n hide-m"><b>${money(totG)}</b></td></tr></tfoot>`:""}

/* ===== VENTAS ===== */
function periodo(){ const h = today();
  switch(UI.vPer){ case "hoy": return [h,h]; case "7": return [addDays(h,-6),h]; case "mes": return [h.slice(0,7)+"-01",h];
    case "mespas": { const d=new Date(h+"T12:00:00"); d.setDate(1); d.setMonth(d.getMonth()-1); const s=isoDate(d); const e=new Date(d); e.setMonth(e.getMonth()+1); e.setDate(0); return [s,isoDate(e)]; }
    default: return ["0000-00-00","9999-12-31"]; } }
VIEWS.ventas = () => {
  const [a,b] = periodo(), q = norm(UI.vQ);
  let tk = C.tlist.filter(t=>t.fecha>=a && t.fecha<=b);
  if (UI.vTipo==="menudeo"||UI.vTipo==="mayoreo") tk = tk.filter(t=>t.tipo===UI.vTipo);
  if (UI.vTipo==="fiado") tk = tk.filter(t=>!t.pagado);
  if (UI.vProd) tk = tk.filter(t=>t.lines.some(l=>l.prod===UI.vProd));
  if (q) tk = tk.filter(t=> norm(t.cliente).includes(q) || norm(t.folio).includes(q) || t.lines.some(l=>norm(pname(l.prod)).includes(q)));
  const lines = tk.flatMap(t=>t.lines).filter(l=>!UI.vProd || l.prod===UI.vProd);
  const r = resumen(lines);
  const groups = {}; for (const t of tk) (groups[t.fecha] ||= []).push(t);
  const prods = Object.values(C.P).sort((x,y)=>x.nombre.localeCompare(y.nombre,"es"));
  return `
  <div class="head"><div><h1>Ventas</h1><p>Toca una venta para ver su ticket o cancelarla.</p></div><a class="btn" href="#vender">+ Nueva venta</a></div>
  <div class="card" style="margin-bottom:14px"><div class="row">
    <div class="seg">${[["hoy","Hoy"],["7","7 días"],["mes","Este mes"],["mespas","Mes pasado"],["todo","Todo"]].map(([k,l])=>`<button data-act="vPer" data-v="${k}" class="${UI.vPer===k?"on":""}">${l}</button>`).join("")}</div>
    <div class="seg">${[["todas","Todas"],["menudeo","Menudeo"],["mayoreo","Mayoreo"],["fiado","Fiado"]].map(([k,l])=>`<button data-act="vTipo" data-v="${k}" class="${UI.vTipo===k?"on":""}">${l}</button>`).join("")}</div>
  </div><div class="row" style="margin-top:10px">
    <select class="inp" id="v-prod" data-bind="vProd" style="max-width:260px" aria-label="Dulce"><option value="">Todos los dulces</option>${prods.map(p=>`<option value="${p.id}" ${UI.vProd===p.id?"selected":""}>${esc(p.nombre)}</option>`).join("")}</select>
    <input class="inp" id="v-q2" data-bind="vQ" value="${esc(UI.vQ)}" placeholder="Cliente, folio o dulce…" style="max-width:280px" autocomplete="off">
  </div></div>
  <div class="grid g3">
    <div class="card kpi"><div class="lab">Vendido</div><div class="val num">${money(r.t)}</div><div class="sub">${tk.length} ventas</div></div>
    <div class="card kpi"><div class="lab">Bolsitas</div><div class="val num">${int(r.b)}</div><div class="sub">${a===b?esc(dShort(a)):UI.vPer==="todo"?"desde el inicio":`${esc(dShort(a))} – ${esc(dShort(b))}`}</div></div>
    <div class="card kpi"><div class="lab">Ganancia</div><div class="val num">${money(r.g)}</div><div class="sub">después de costo de dulce y bolsita</div></div>
  </div>
  ${Object.keys(groups).length ? Object.entries(groups).map(([f,ts])=>`
    <div class="card" style="margin-top:14px"><div class="row"><h3 style="text-transform:capitalize">${esc(dLong(f))}</h3><span class="sp"></span><b class="num">${money(ts.reduce((s,t)=>s+t.total,0))}</b></div>
    <div class="list" style="margin-top:4px">${ts.map(t=>ticketRow(t)).join("")}</div></div>`).join("") : `<div class="card empty" style="margin-top:14px">No hay ventas con estos filtros.</div>`}`;
};
function ticketRow(t){
  const desc = t.lines.map(l=>`${int(l.cant)} ${pname(l.prod)}`).join(", ");
  return `<div class="li click" data-act="ticket" data-id="${esc(t.id)}"><div style="min-width:0"><div class="t">${esc(desc)}</div>
    <div class="s">${t.creado>1e12 && t.folio?esc(hhmm(t.creado))+" · ":""}${t.tipo==="mayoreo"?"Mayoreo":"Menudeo"}${t.cliente?` · ${esc(t.cliente)}`:""}</div></div>
    <div class="right"><div class="num"><b>${money(t.total)}</b></div>${t.pagado?`<span class="pill p-mut">${esc(METODOS[t.metodo]||"Pagado")}</span>`:`<span class="pill p-warn">Fiado</span>`}</div></div>`;
}

VIEWS.buscar = () => {
  const q = norm(UI.gq);
  let res = "";
  if (q){
    const ps = Object.values(C.P).filter(p=>norm(p.nombre).includes(q)).slice(0,12);
    const cs = Object.values(C.CL).filter(c=>norm(c.nombre).includes(q)).slice(0,12);
    const ts = C.tlist.filter(t=> norm(t.folio).includes(q) || norm(t.cliente).includes(q) || t.lines.some(l=>norm(pname(l.prod)).includes(q)) || norm(dLong(t.fecha)).includes(q) || t.fecha.includes(UI.gq.trim())).slice(0,25);
    const ab = S.abonos.filter(a=> norm(a.cliente).includes(q) || norm(a.folio).includes(q));
    res = `
    <div class="card" style="margin-top:14px"><h2>Dulces <span class="muted">(${ps.length})</span></h2><div class="list">${ps.map(p=>`<div class="li click" data-act="prod" data-id="${p.id}"><span class="t">${esc(p.nombre)}${p.activo===false?' <span class="pill p-mut">Archivado</span>':""}</span><span class="right row" style="gap:8px"><span class="muted num">${money(p.precio)}</span>${estadoPill(p)}</span></div>`).join("") || `<div class="empty">Ninguno</div>`}</div></div>
    <div class="card" style="margin-top:14px"><h2>Clientes <span class="muted">(${cs.length})</span></h2><div class="list">${cs.map(c=>`<div class="li click" data-act="cli" data-k="${esc(c.k)}"><span class="t">${esc(c.nombre)}</span><span class="right">${c.saldo>0?`<span class="pill p-warn num">Debe ${money(c.saldo)}</span>`:`<span class="pill p-ok">Al corriente</span>`}</span></div>`).join("") || `<div class="empty">Ninguno</div>`}</div></div>
    <div class="card" style="margin-top:14px"><h2>Ventas <span class="muted">(${ts.length}${ts.length===25?"+":""})</span></h2><div class="list">${ts.map(t=>ticketRow(t).replace('<div class="t">',`<div class="t"><span class="muted" style="font-weight:600">${esc(dShort(t.fecha))} · </span>`)).join("") || `<div class="empty">Ninguna</div>`}</div></div>
    ${ab.length?`<div class="card" style="margin-top:14px"><h2>Pagos de fiado</h2><div class="list">${ab.map(a=>`<div class="li click" data-act="recibo" data-id="${esc(a.id)}"><span class="t">${esc(a.cliente)} <span class="muted">${esc(dShort(a.fecha))}</span></span><span class="right num"><b>${money(a.monto)}</b></span></div>`).join("")}</div></div>`:""}`;
  }
  return `<div class="head"><div><h1>Buscar</h1><p>Busca un dulce, un cliente, un folio de ticket o una fecha (por ejemplo “2026-11-09”).</p></div></div>
  <input class="inp" id="g-q" data-bind="gq" value="${esc(UI.gq)}" placeholder="¿Qué buscas?" autocomplete="off" style="font-size:17px;min-height:50px">
  ${res || `<div class="empty">Escribe para empezar a buscar.</div>`}`;
};

/* ---------- modales ---------- */
let modalClose = null;
function openModal(html, onMount){
  $("#modalroot").innerHTML = `<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const sc = $("#scrim"); sc.addEventListener("mousedown", e=>{ if (e.target===sc) closeModal(); });
  const first = sc.querySelector("input,select,button"); if (first) setTimeout(()=>first.focus(),30);
  if (onMount) onMount(sc);
}
function closeModal(){ $("#modalroot").innerHTML = ""; }
document.addEventListener("keydown", e=>{ if (e.key==="Escape" && $("#scrim")) closeModal(); });
function toast(msg){ const t = $("#toastroot"); t.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(()=> t.innerHTML="", 2800); }
function confirmar(titulo, texto, si, fn, danger=true){
  openModal(`<h2>${esc(titulo)}</h2><p>${texto}</p><div class="acts"><button class="btn ghost" data-m="no">No, volver</button><button class="btn ${danger?"danger":""}" data-m="si">${esc(si)}</button></div>`, sc=>{
    sc.querySelector('[data-m="no"]').onclick = closeModal;
    sc.querySelector('[data-m="si"]').onclick = async e=>{ e.target.disabled = true; await fn(); closeModal(); };
  });
}
function writeErr(e){
  console.error(e);
  const c = e && e.code;
  if (c==="permission-denied") toast("Firebase no dejó guardar: revisa que tu correo esté bien escrito en las reglas.");
  else if (c==="invalid_argument") toast("No se pudo guardar: tu acceso es solo de lectura.");
  else if (c==="quota_exceeded") toast("Se llenó el espacio de la app. Descarga tu Excel y avísame para depurar datos viejos.");
  else toast("No se pudo guardar. Revisa tu conexión e inténtalo otra vez.");
}

async function descargarTicket(d){
  const img = new Image(); img.src = LOGO; await img.decode().catch(()=>{});
  const W0 = 380, s = 2, lines = [];
  const cv = document.createElement("canvas"); const x = cv.getContext("2d");
  const F = (w,sz,fam) => `${w} ${sz}px ${fam}`;
  // armar lista de renglones
  const rows = [];
  rows.push({img:true,h:96}); rows.push({c:"Osito Golosito",f:F(600,24,"Fredoka, sans-serif"),col:"#C3165A",h:30});
  if (S.cfg.telefono) rows.push({c:S.cfg.telefono,f:F(400,14,"Nunito, sans-serif"),h:20});
  rows.push({hr:true}); rows.push({c:d.titulo,f:F(800,16,"Nunito, sans-serif"),h:24});
  const kv = (a,b,f) => rows.push({l:a,r:b,f:f||F(400,14,"Nunito, sans-serif"),h:21});
  kv("Folio", d.folio||"—"); kv("Fecha", dFull(d.fecha)+(d.hora?" "+d.hora:"")); if (d.cliente) kv("Cliente", d.cliente); if (d.tipo) kv("Tipo", d.tipo==="mayoreo"?"Mayoreo":"Menudeo");
  rows.push({hr:true});
  for (const l of d.lines){ kv((l.c!=null?l.c+" × ":"")+l.n, money(l.c!=null?l.c*l.p:l.p)); if (l.c!=null) rows.push({l:money(l.p)+" c/u",f:F(400,12,"Nunito, sans-serif"),col:"#8a5a70",h:17}); }
  rows.push({hr:true}); kv("Total", money(d.total), F(600,24,"Fredoka, sans-serif")); rows[rows.length-1].h = 32;
  for (const [a,b] of d.extra) kv(a,b);
  rows.push({stamp:d.estado,pag:d.pagado,h:44});
  if (S.cfg.mensaje) rows.push({c:S.cfg.mensaje,f:F(600,14,"Nunito, sans-serif"),h:24});
  const H0 = 24 + rows.reduce((a,r)=>a+(r.hr?16:r.h),0) + 18;
  cv.width = W0*s; cv.height = H0*s; x.scale(s,s);
  x.fillStyle="#fff"; x.fillRect(0,0,W0,H0); x.strokeStyle="#E7B9CB"; x.setLineDash([6,4]); x.strokeRect(6,6,W0-12,H0-12); x.setLineDash([]);
  let y = 22; const L = 24, R = W0-24;
  x.textBaseline = "middle";
  for (const r of rows){
    if (r.img){ try{ x.drawImage(img, W0/2-44, y, 88, 88); }catch(e){} y += r.h; continue; }
    if (r.hr){ x.strokeStyle="#D8A8BB"; x.setLineDash([4,3]); x.beginPath(); x.moveTo(L,y+8); x.lineTo(R,y+8); x.stroke(); x.setLineDash([]); y+=16; continue; }
    if (r.stamp){ x.font = F(800,14,"Nunito, sans-serif"); const tw = x.measureText(r.stamp).width+24; x.fillStyle = r.pag?"#E1F4E8":"#FFF0D6"; roundRect(x, W0/2-tw/2, y+8, tw, 28, 8); x.fill(); x.fillStyle = r.pag?"#1E7546":"#9A5800"; x.textAlign="center"; x.fillText(r.stamp, W0/2, y+22); y+=r.h; continue; }
    x.font = r.f; x.fillStyle = r.col || "#2B1020";
    if (r.c!=null){ x.textAlign="center"; x.fillText(r.c, W0/2, y+r.h/2); }
    else { x.textAlign="left"; let lt = r.l; const maxw = r.r? (R-L) - x.measureText(r.r).width - 12 : R-L; while (x.measureText(lt).width>maxw && lt.length>3) lt = lt.slice(0,-2); if (lt!==r.l) lt = lt.slice(0,-1)+"…"; x.fillText(lt, L, y+r.h/2); if (r.r){ x.textAlign="right"; x.fillText(r.r, R, y+r.h/2); } }
    y += r.h;
  }
  const blob = await new Promise(res=>cv.toBlob(res,"image/png"));
  try{ await S.dl.save({filename:`${(d.titulo.startsWith("Comprobante")?"Comprobante":"Ticket")}-${d.folio||d.fecha}.png`, data:blob}); toast("Imagen lista"); }
  catch(e){ if (e && e.code!=="declined") toast("No se pudo descargar la imagen"); }
}
function roundRect(x,a,b,w,h,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); }

  const btn = document.querySelector('[data-act="registrar"]'); if (btn) btn.disabled = true;
  const ok = await W(async db=>{ for (const l of UI.cart){ const d = {fecha:UI.fecha||today(), prod:l.prod, cant:+l.cant, precio:+l.precio, tipo:UI.tipo, pagado:!fiado, ticket:tk, creado};
    if (!fiado) d.metodo = UI.metodo; if (known) d.cliente = known; await db.collection("ventas").add(d); } });
  if (!ok){ if (btn) btn.disabled = false; return; }
  const total = UI.cart.reduce((s,l)=>s+l.cant*l.precio,0);
  UI.cart = []; UI.q = ""; if (fiado){ UI.pago = "pagado"; } UI.cliente = "";
  render(); toast(fiado?`Anotado: ${known} debe ${money(total)} más`:`Venta registrada: ${money(total)}`);
  setTimeout(()=>{ if (C.tickets[tk]) ticketModal(tk); }, 500);
}

/* ---------- Excel ---------- */
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function exportarExcel(){
  try{ if (!window.XLSX) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"); }catch(e){ toast("No se pudo preparar el Excel. Revisa tu conexión."); return; }
  const r2 = n => Math.round(n*100)/100;
  const wb = XLSX.utils.book_new();
  const add = (name, rows) => { const ws = XLSX.utils.aoa_to_sheet(rows); ws["!cols"] = rows[0].map((_,i)=>({wch: Math.min(40, Math.max(10, ...rows.map(r=>String(r[i]??"").length+2)))})); XLSX.utils.book_append_sheet(wb, ws, name); };
  add("Resumen", [["Concepto","Valor"],["Invertido",r2(C.inversion)],["Cobrado (ventas pagadas + abonos)",r2(C.cobrado)],["Me deben",r2(C.porCobrar)],["Vendido en total",r2(C.vendidoTot)],["Bolsitas en existencia",C.existTot],["Valor de lo que queda (a precio de venta)",r2(C.quedaValor)],["Efectivo",r2(C.porMetodo.efectivo)],["Transferencia",r2(C.porMetodo.transferencia)],["Tarjeta",r2(C.porMetodo.tarjeta)],["Fecha de descarga",today()]]);
  add("Inventario", [["Dulce","Costo por bolsita","Precio","Precio mayoreo","Armadas","Vendidas","En existencia","Dinero cobrado","Ganancia","Activo"],
    ...Object.values(C.P).sort((a,b)=>a.nombre.localeCompare(b.nombre,"es")).map(p=>[p.nombre,r2(p.unit),+p.precio,p.precioMayoreo??S.cfg.precioMayoreo,p.armadas,p.vend,p.exist,r2(p.vendido),r2(p.ganancia),p.activo===false?"No":"Sí"])]);
  add("Ventas", [["Fecha","Folio","Dulce","Bolsitas","Precio c/u","Total","Tipo","Pago","Forma de pago","Cliente"],
    ...[...S.ventas].sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:(a.creado||0)-(b.creado||0)).map(v=>[v.fecha,v.ticket||"",pname(v.prod),+v.cant,+v.precio,r2(v.cant*v.precio),v.tipo==="mayoreo"?"Mayoreo":"Menudeo",v.pagado===false?"Fiado":"Pagado",v.pagado===false?"":(METODOS[v.metodo]||""),v.cliente||""])]);
  add("Me deben", [["Cliente","Fiado total","Abonado","Saldo"], ...Object.values(C.CL).filter(c=>c.debe>0).map(c=>[c.nombre,r2(c.debe),r2(c.pago),r2(c.saldo)])]);
  add("Pagos de fiado", [["Fecha","Folio","Cliente","Monto","Forma de pago","Nota"], ...S.abonos.map(a=>[a.fecha,a.folio||"",a.cliente,+a.monto,METODOS[a.metodo]||"",a.nota||""])]);
  add("Compras", [["Fecha","Concepto","Bolsitas","Costo","Tipo","Nota"], ...S.compras.map(c=>[c.fecha,c.prod?pname(c.prod):(c.concepto||""),+c.bolsitas||0,+c.costo||0,c.tipo||"",c.nota||""])]);
  const buf = XLSX.write(wb,{bookType:"xlsx",type:"array"});
  try{ await S.dl.save({filename:`Osito Golosito ${today()}.xlsx`, data:new Blob([buf])}); toast("Excel listo"); }
  catch(e){ if (e && e.code!=="declined") toast("No se pudo descargar el Excel"); }
}

/* ---------- eventos ---------- */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]"); if (!el || el.closest("#scrim")) return;
  const a = el.dataset.act, v = el.dataset.v;
  switch(a){
    case "tipo": UI.tipo = v; UI.cart.forEach(l=>{ const p = C.P[l.prod]; if (p) l.precio = precioPara(p); }); render(); break;
    case "pago": UI.pago = v; render(); break;
    case "metodo": UI.metodo = v; render(); break;
    case "add": { const p = C.P[el.dataset.id]; const l = UI.cart.find(x=>x.prod===p.id); if (l) l.cant = (+l.cant||0)+1; else UI.cart.push({prod:p.id, cant:1, precio:precioPara(p)}); render(); break; }
    case "cartinc": UI.cart[+el.dataset.i].cant = (+UI.cart[+el.dataset.i].cant||0)+1; render(); break;
    case "cartdec": { const l = UI.cart[+el.dataset.i]; l.cant = Math.max(1,(+l.cant||1)-1); render(); break; }
    case "cartdel": UI.cart.splice(+el.dataset.i,1); render(); break;
    case "registrar": registrarVenta(); break;
    case "tocart": document.querySelector(".cart")?.scrollIntoView({behavior:"smooth",block:"start"}); break;
    case "prod": prodModal(el.dataset.id); break;
    case "invF": UI.invF = v; render(); break;
    case "nuevoprod": nuevoProdModal(); break;
    case "vPer": UI.vPer = v; render(); break;
    case "vTipo": UI.vTipo = v; render(); break;
    case "ticket": ticketModal(el.dataset.id); break;
    case "recibo": reciboModal(el.dataset.id); break;
    case "cli": UI.cliSel = el.dataset.k; if (UI.route!=="fiados") go("fiados"); else render(); window.scrollTo(0,0); break;
    case "cliback": UI.cliSel = null; render(); break;
    case "cobrar": cobrarModal(el.dataset.k, !!el.dataset.total); break;
    case "fiarle": UI.pago = "fiado"; UI.cliente = C.CL[el.dataset.k]?.nombre||""; go("vender"); break;
    case "nuevofiado": UI.pago = "fiado"; UI.cliente = ""; go("vender"); break;
    case "reabastecer": reabModal(); break;
    case "gasto": gastoModal(); break;
    case "delcompra": { const c = S.compras.find(x=>x.id===el.dataset.id); if (!c) break;
      confirmar("¿Borrar este registro?", c.prod?`Se quitarán ${int(c.bolsitas)} bolsitas de ${esc(pname(c.prod))} del inventario y ${money(c.costo)} de tu inversión.`:`Se quitarán ${money(c.costo)} de tu inversión.`, "Sí, borrar", async ()=>{ const ok = await W(db=>db.doc("compras/"+c.id).delete()); if (ok) toast("Registro borrado"); }); break; }
    case "excel": exportarExcel(); break;

/* ---------- guardar archivos (tickets, Excel, respaldo) ---------- */
async function saveFile(data, filename){
  const types = {png:"image/png", xlsx:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", json:"application/json"};
  const ext = filename.split(".").pop().toLowerCase();
  const file = new File([data instanceof Blob ? data : new Blob([data])], filename, {type: types[ext]||"application/octet-stream"});
  const mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  if (mobile && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return {status:"saved"}; }
    catch(x){ if (x && x.name==="AbortError") throw {code:"declined"}; }
  }
  const url = URL.createObjectURL(file), a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  return {status:"saved"};
}
S.dl = {save: ({filename, data}) => saveFile(data, filename)};

/* ---------- respaldo ---------- */
function armarRespaldo(){
  const strip = o => { const x = {...o}; delete x.id; return x; };
  return {app:"osito-golosito", version:1, exportado:new Date().toISOString(),
    productos:Object.entries(S.prods).map(([id,p])=>({id, ...strip(p)})), compras:S.compras, ventas:S.ventas, abonos:S.abonos, config:S.cfg};
}
async function descargarRespaldo(){
  try{ await saveFile(JSON.stringify(armarRespaldo()), `osito-respaldo-${today()}.json`); toast("Respaldo listo"); }catch(x){ if (!x || x.code!=="declined") toast("No se pudo descargar el respaldo"); }
}
document.addEventListener("change", async e=>{
  if (e.target.id!=="imp") return;
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  let d; try{ d = JSON.parse(await file.text()); }catch(x){ toast("Ese archivo no es un respaldo de Osito Golosito."); return; }
  if (!d || d.app!=="osito-golosito"){ toast("Ese archivo no es un respaldo de Osito Golosito."); return; }
  const items = [];
  const put = (col, arr) => (arr||[]).forEach(o=>{ const {id, ...rest} = o; if (id) items.push({col, id:String(id), data:rest}); });
  put("productos", d.productos); put("compras", d.compras); put("ventas", d.ventas); put("abonos", d.abonos);
  if (d.config) items.push({col:"config", id:"general", data:d.config});
  confirmar("¿Cargar este respaldo?", `Trae ${(d.productos||[]).length} dulces, ${(d.ventas||[]).length} ventas, ${(d.compras||[]).length} compras y ${(d.abonos||[]).length} pagos. Si algo ya existe en la app, se reemplaza con lo del respaldo.`, "Sí, cargar", async ()=>{
    if (!navigator.onLine){ toast("Necesitas internet para cargar el respaldo."); return; }
    try{ await S.db.importAll(items, (a,b)=>toast(`Cargando… ${a} de ${b}`)); toast("¡Listo! Tus datos ya están en la app."); go("inicio"); }
    catch(x){ writeErr(x); }
  }, false);
});
document.addEventListener("click", e=>{
  const a = e.target.closest("[data-act]"); if (!a || a.closest("#scrim")) return;
  if (a.dataset.act==="respaldo") descargarRespaldo();
  if (a.dataset.act==="salir") confirmar("¿Cerrar sesión?", "Para volver a entrar necesitarás tu correo, tu contraseña e internet.", "Cerrar sesión", async ()=>{ await window.OG_AUTH.signOut(); }, false);
});

/* ---------- arranque ---------- */
routeFromHash(); render();
window.OG = {
  setup(msg){ S.setup = msg; S.user = null; render(); },
  setUser(u){ S.user = u; render(); },
  lateError(e){ writeErr(e); },
  start(db){
    S.db = db;
    const slowT = setTimeout(()=>{ S.slow = true; render(); }, 10000);
    const done = (k,snap) => { if (!snap.metadata.fromCache){ S.loaded[k] = true; if (allLoaded()){ clearTimeout(slowT); S.slow = false; } } render(); };
    const fail = e => { clearTimeout(slowT); console.error(e); S.err = (e && e.code==="permission-denied") ? "Firebase no te deja ver los datos. Revisa que en las reglas esté tu correo exactamente igual que con el que entras." : "Se perdió la conexión con tus datos. Cierra y vuelve a abrir la app."; render(); };
    const coll = (name,key) => db.collection(name).onSnapshot(snap=>{ const arr = snap.docs.map(d=>({id:d.id, ...d.data()})); if (key==="prods"){ S.prods = Object.fromEntries(arr.map(p=>[p.id,p])); } else S[key] = arr; done(key,snap); }, fail);
    coll("productos","prods"); coll("compras","compras"); coll("ventas","ventas"); coll("abonos","abonos");
    db.doc("config/general").onSnapshot(s=>{ S.cfg = {...DEF_CFG, ...(s.exists ? s.data() : {})}; render(); }, ()=>{});
  }
};
if ("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});

<script type="module">
/* Conexión con Firebase: inicio de sesión y base de datos que también funciona sin internet. */
const V = "10.12.2", B = `https://www.gstatic.com/firebasejs/${V}/`;
const cfg = window.OSITO_FIREBASE;
if (!cfg || !cfg.apiKey || String(cfg.apiKey).includes("PEGA")) {
  window.OG.setup("Falta configurar Firebase. Abre el archivo config.js y pega ahí los datos de tu proyecto (sigue la guía).");
} else {
  try {
    const [{initializeApp}, A, F] = await Promise.all([import(B+"firebase-app.js"), import(B+"firebase-auth.js"), import(B+"firebase-firestore.js")]);
    const app = initializeApp(cfg);
    const auth = A.getAuth(app);
    let fs;
    try { fs = F.initializeFirestore(app, {localCache: F.persistentLocalCache({tabManager: F.persistentMultipleTabManager()})}); }
    catch (e) { fs = F.getFirestore(app); }

    // Las escrituras se guardan al instante en el teléfono; si no hay internet se suben después.
    const soft = p => { let done = false; p.then(()=>{done=true;}, e=>{ if (done) return; done = true; window.OG.lateError(e); });
      return Promise.race([p, new Promise(r=>setTimeout(r, 1500))]); };
    const wrapQ = s => ({ docs: s.docs.map(d=>({id:d.id, exists:true, data:()=>d.data()})), metadata: s.metadata });
    const wrapD = s => ({ id:s.id, exists:s.exists(), data:()=>s.data(), metadata: s.metadata });
    const docRef = r => ({
      id: r.id,
      set: d => soft(F.setDoc(r, d)),
      update: d => soft(F.updateDoc(r, d)),
      delete: () => soft(F.deleteDoc(r)),
      onSnapshot: (n, e) => F.onSnapshot(r, {includeMetadataChanges:true}, s=>n(wrapD(s)), e)
    });
    const db = {
      collection: name => { const c = F.collection(fs, name); return {
        doc: id => docRef(id ? F.doc(c, id) : F.doc(c)),
        add: d => soft(F.setDoc(F.doc(c), d)),
        onSnapshot: (n, e) => F.onSnapshot(c, {includeMetadataChanges:true}, s=>n(wrapQ(s)), e)
      }; },
      doc: path => docRef(F.doc(fs, path)),
      importAll: async (items, progress) => {          // items: [{col, id, data}]
        for (let i = 0; i < items.length; i += 400) {
          const b = F.writeBatch(fs);
          for (const it of items.slice(i, i+400)) b.set(F.doc(fs, it.col, it.id), it.data);
          await b.commit(); progress && progress(Math.min(items.length, i+400), items.length);
        }
      }
    };
    window.OG_AUTH = {
      signIn: (email, pass) => A.signInWithEmailAndPassword(auth, email.trim(), pass),
      reset: email => A.sendPasswordResetEmail(auth, email.trim()),
      signOut: () => A.signOut(auth)
    };
    let started = false;
    A.onAuthStateChanged(auth, user => {
      if (user) { window.OG.setUser({email:user.email}); if (!started){ started = true; window.OG.start(db); } }
      else { if (started) { location.reload(); return; } window.OG.setUser(null); }
    });
  } catch (e) {
    console.error(e);
    window.OG.setup("No se pudo abrir la app. Si es la primera vez, necesitas internet para que se descargue. Si ya tenías internet, revisa los datos de config.js.");
  }
}
</script>
